# name of workflow
name: Deploy to VPS

# when to run
on:
  push:
    branches:
      - main

# the work to do
jobs:
  deploy-vps: # name of job
    runs-on: ubuntu-latest # OS to use for runner
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # silence warning

    steps: # list of steps to do in order
      - name: Checkout code
        uses: actions/checkout@v4.2.2 # clones repo onto runner

      - name: Setup Node
        uses: actions/setup-node@v4.3.0 # installs node on the runner
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci # npm install for CI environment

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Set up SSH
        # store ssh key from secrets and add VPS fingerprint to known hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        # rsync build to VPS
        run: |
          rsync -avz --delete \
          -e "ssh -i ~/.ssh/deploy_key" \
          frontend/dist/ \
          ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/linettekuhn.com

  deploy-gh-pages: # name of job
    runs-on: ubuntu-latest # OS to use for runner
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # silence warning
    permissions:
      contents: write

    steps: # list of steps to do in order
      - name: Checkout code
        uses: actions/checkout@v4.2.2 # clones repo onto runner

      - name: Setup Node
        uses: actions/setup-node@v4.3.0 # installs node on the runner
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci # npm install for CI environment

      - name: Configure git identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Deploy to GitHub Pages
        working-directory: frontend
        run: npm run predeploy && npm run deploy # run deploy scripts for gh pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
