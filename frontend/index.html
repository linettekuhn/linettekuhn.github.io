<!doctype html>
<html lang="en" class="no-gpu" style="transition: opacity 0.4s ease">
  <head>
    <style>
      html {
        opacity: 0;
        transition: opacity 0.4s ease;
      }
    </style>
    <script>
      document.documentElement.style.opacity = "0";

      (function () {
        const stored = localStorage.getItem("reduce-motion");
        const prefersReduced = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;
        if (stored === "true" || (stored === null && prefersReduced)) {
          document.documentElement.classList.add("no-gpu");
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/icons/smiley_winking_face.svg"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linette Kühn</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
